name: Backend CI - Build & Push Docker
on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: spring-backend

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java (important pour tests / build optionnel)
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 3. Login Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Préparer le nom complet de l'image
      - name: Define Docker image
        id: image
        run: |
          echo "docker_image=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      # 5. Build Docker image
      - name: Build Docker image
        run: |
          docker build -t ${{ steps.image.outputs.docker_image }} .

      # 6. Push Docker image
      - name: Push Docker image
        run: |
          docker push ${{ steps.image.outputs.docker_image }}
